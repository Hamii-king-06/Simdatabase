<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Lookup Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0a0a0a;--card:#141414;--border:rgba(255,255,255,0.08);--accent:#22c55e;--white:#fff;--muted:rgba(255,255,255,0.5)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
.container{width:100%;max-width:550px}
.header{text-align:center;margin-bottom:30px}
.header h1{font-size:24px;font-weight:700;margin-bottom:6px}
.header h1 span{color:var(--accent)}
.header p{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px}
.input-group{display:flex;gap:10px}
input{flex:1;background:#1a1a1a;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:12px 16px;color:var(--white);font-size:15px;font-family:'JetBrains Mono',monospace;outline:none;transition:border 0.2s}
input:focus{border-color:var(--accent)}
button{background:var(--accent);color:#000;border:none;border-radius:8px;padding:0 22px;font-weight:700;cursor:pointer;transition:opacity 0.2s}
button:hover{opacity:0.9}
button:disabled{opacity:0.5;cursor:not-allowed}
.results{display:none}
.results.active{display:block}
.result-item{background:#1a1a1a;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.result-item:last-child{margin-bottom:0}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:13px}
.row:last-child{border-bottom:none}
.label{color:var(--muted)}
.value{color:var(--white);font-weight:600;font-family:'JetBrains Mono',monospace;text-align:right}
.error-msg{color:#ef4444;text-align:center;font-size:13px;padding:15px}
.loader{text-align:center;padding:30px;color:var(--accent);display:none}
.loader.active{display:block}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Data <span>Lookup System</span></h1>
    <p>Enter mobile number or CNIC to fetch details</p>
  </div>

  <div class="card">
    <div class="input-group">
      <input type="text" id="searchInput" placeholder="03001234567" maxlength="15">
      <button id="searchBtn" onclick="fetchData()">Search</button>
    </div>
  </div>

  <div class="loader" id="loader">
    <i class="fas fa-circle-notch fa-spin fa-2x"></i>
    <p style="margin-top:10px;font-size:13px">Fetching records...</p>
  </div>

  <div class="results" id="resultsContainer"></div>
</div>

<script>
async function fetchData() {
  const query = document.getElementById('searchInput').value.trim();
  const resultsContainer = document.getElementById('resultsContainer');
  const loader = document.getElementById('loader');
  const btn = document.getElementById('searchBtn');

  if (!query) {
    alert('Please enter a query first.');
    return;
  }

  loader.classList.add('active');
  resultsContainer.classList.remove('active');
  resultsContainer.innerHTML = '';
  btn.disabled = true;

  try {
    // Ye aapke Vercel serverless function ko hit karega
    const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    const res = await response.json();

    loader.classList.remove('active');
    btn.disabled = false;

    if (!res.ok || !res.data || res.data.length === 0) {
      resultsContainer.innerHTML = '<div class="card error-msg">No data found or request blocked by target server.</div>';
      resultsContainer.classList.add('active');
      return;
    }

    let html = '';
    res.data.forEach(item => {
      html += `
        <div class="result-item">
          <div class="row"><span class="label">Number</span><span class="value">${item.nbr || 'N/A'}</span></div>
          <div class="row"><span class="label">Name</span><span class="value">${item.nam || 'N/A'}</span></div>
          <div class="row"><span class="label">CNIC</span><span class="value">${item.cni || 'N/A'}</span></div>
          <div class="row"><span class="label">Address</span><span class="value">${item.adr || 'N/A'}</span></div>
        </div>
      `;
    });

    resultsContainer.innerHTML = html;
    resultsContainer.classList.add('active');

  } catch (err) {
    loader.classList.remove('active');
    btn.disabled = false;
    resultsContainer.innerHTML = '<div class="card error-msg">Connection error occurred.</div>';
    resultsContainer.classList.add('active');
  }
}
</script>

</body>
</html>
